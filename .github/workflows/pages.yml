name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      # The HTML is generated by scripts/build_pages.py but committed, so a hand
      # edit to a .html file looks fine until the next build silently reverts
      # it. This step makes that mistake fail the deploy instead.
      - name: Check the committed HTML matches the generator
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet --disable-pip-version-check pillow
          python3 scripts/build_pages.py
          git diff --exit-code -- '*.html' robots.txt sitemap.xml \
            || { echo "::error::Committed HTML is stale. Run scripts/build_pages.py and commit the result."; exit 1; }
      - name: Stage site files
        run: |
          mkdir _site
          cp index.html research.html models.html people.html join.html publications.html news.html contact.html 404.html .nojekyll robots.txt sitemap.xml _site/
          cp -R css js assets _site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
